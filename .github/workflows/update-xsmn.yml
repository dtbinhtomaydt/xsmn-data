name: Cap nhat du lieu XSMN

# Chay tu dong moi ngay luc 13:00 UTC (= 20:00 gio Viet Nam), va cho phep
# bam "Run workflow" thu cong bat cu luc nao de test.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Cho phep workflow tu commit/push vao chinh repo nay (dung GITHUB_TOKEN
# co san mac dinh — KHONG can tao secret/token nao them).
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chay scraper
        run: node scrape-xsmn.js

      - name: Commit & push neu co thay doi
        run: |
          git config user.name "xsmn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/xsmn.json
          if git diff --cached --quiet; then
            echo "Khong co du lieu moi hom nay."
          else
            git commit -m "Cap nhat du lieu XSMN $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
