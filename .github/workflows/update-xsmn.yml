name: Cap nhat du lieu XSMN, Mega 6/45, Power 6/55

# Chay tu dong moi ngay luc 13:00 UTC (= 20:00 gio Viet Nam), va cho phep
# bam "Run workflow" thu cong bat cu luc nao de test.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Cho phep workflow tu commit/push vao chinh repo nay (dung GITHUB_TOKEN
# co san mac dinh — KHONG can tao secret/token nao them).
permissions:
  contents: write

# Neu 2 lan chay bi trung nhau (vd bam "Run workflow" nhieu lan gan nhau, hoac trung
# gio voi lich tu dong) — XEP HANG lan lai thay vi chay song song, tranh loi "push bi
# tu choi vi remote co thay doi chua co o local" (git push rejected).
concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chay scraper XSMN
        run: node scrape-xsmn.js

      - name: Chay scraper Mega 6/45 + Power 6/55
        run: node scrape-pick.js

      - name: Commit & push neu co thay doi
        run: |
          git config user.name "xsmn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/xsmn.json data/pick.json
          if git diff --cached --quiet; then
            echo "Khong co du lieu moi hom nay."
          else
            git commit -m "Cap nhat du lieu $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Dong bo voi remote truoc khi push (phong truong hop co lan chay khac vua push
            # truoc do) — thu toi da 5 lan, moi lan cach nhau vai giay.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push lan $i that bai, thu lai..."
              sleep 5
            done
          fi
